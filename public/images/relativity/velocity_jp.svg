<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">速度は単純な足し算にならない</title><desc id="description">0.6c同士の速度の合成は0.882c。光速はcのまま。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">速度は単純な足し算にならない</text><rect x="32" y="85" width="896" height="125" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><rect x="32" y="235" width="896" height="125" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="56" y="121" font-size="23" fill="#2563eb" text-anchor="start" font-weight="400">前方へ探査機を発射</text><text x="56" y="175" font-size="23" fill="#172033" text-anchor="start" font-weight="400">船：0.6c</text><path d="M225,167 L290,167" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="175" font-size="22" fill="#172033" text-anchor="start" font-weight="400">探査機：船の系で0.6c</text><path d="M630,167 L695,167" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="715" y="175" font-size="29" fill="#2563eb" text-anchor="start" font-weight="400">0.882c</text><text x="56" y="271" font-size="23" fill="#0f766e" text-anchor="start" font-weight="400">前方へ光を放出</text><text x="56" y="325" font-size="23" fill="#172033" text-anchor="start" font-weight="400">船：0.6c</text><path d="M225,317 L290,317" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="325" font-size="22" fill="#172033" text-anchor="start" font-weight="400">光：船の系でc</text><path d="M630,317 L695,317" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="715" y="325" font-size="29" fill="#0f766e" text-anchor="start" font-weight="400">c</text><text x="32" y="401" font-size="18" fill="#526078" text-anchor="start" font-weight="400">右端は惑星側の基準系での速度。同一直線上の運動。</text></g></svg>
