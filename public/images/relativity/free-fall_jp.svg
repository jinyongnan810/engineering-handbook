<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">無重量は、一緒に自由落下している状態</title><desc id="description">漂う部屋と自由落下する部屋では物が浮き、加速度計はゼロ。地面に支えられた部屋ではゼロにならない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">無重量は、一緒に自由落下している状態</text><rect x="32" y="87" width="276" height="266" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="170" y="124" font-size="20" fill="#172033" text-anchor="middle" font-weight="400">遠方を漂う部屋</text><rect x="90" y="150" width="160" height="110" rx="2" fill="white" stroke="#526078"/><circle cx="170" cy="193" r="9" fill="#2563eb" stroke="none" stroke-width="3"/><text x="170" y="291" font-size="18" fill="#526078" text-anchor="middle" font-weight="400">物は部屋と一緒に浮かぶ。</text><text x="170" y="331" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="400">加速度計：0</text><rect x="342" y="87" width="276" height="266" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="480" y="124" font-size="20" fill="#172033" text-anchor="middle" font-weight="400">地球付近を自由落下</text><rect x="400" y="150" width="160" height="110" rx="2" fill="white" stroke="#526078"/><circle cx="480" cy="193" r="9" fill="#2563eb" stroke="none" stroke-width="3"/><path d="M582,160 L582,235" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="291" font-size="18" fill="#526078" text-anchor="middle" font-weight="400">物は部屋と一緒に浮かぶ。</text><text x="480" y="331" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="400">加速度計：0</text><rect x="652" y="87" width="276" height="266" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="790" y="124" font-size="20" fill="#172033" text-anchor="middle" font-weight="400">地面に支えられた部屋</text><rect x="710" y="150" width="160" height="110" rx="2" fill="white" stroke="#526078"/><circle cx="790" cy="193" r="9" fill="#2563eb" stroke="none" stroke-width="3"/><path d="M790,211 L790,245" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M740,296 L740,264" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="768" y="291" font-size="19" fill="#0f766e" text-anchor="start" font-weight="400">支持力</text><text x="790" y="331" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="400">加速度計：ゼロではない</text><text x="32" y="399" font-size="18" fill="#526078" text-anchor="start" font-weight="400">局所的な比較。広い範囲では潮汐効果から時空の曲がりが分かる。</text></g></svg>
