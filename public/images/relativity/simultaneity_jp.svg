<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">基準系によって違う、遠くの「今」</title><desc id="description">同じ二つの発光がSでは同時、S′ではBが0.75年先になる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">基準系によって違う、遠くの「今」</text><rect x="32" y="83" width="432" height="280" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><rect x="496" y="83" width="432" height="280" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="56" y="120" font-size="24" fill="#2563eb" text-anchor="start" font-weight="400">装置の基準系 S</text><text x="520" y="120" font-size="24" fill="#0f766e" text-anchor="start" font-weight="400">船の基準系 S′・v = 0.6c</text><path d="M105,309 L105,146" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><path d="M83,202 L420,202" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><text x="111" y="160" font-size="18" fill="#526078" text-anchor="start" font-weight="400">時刻</text><text x="410" y="227" font-size="19" fill="#526078" text-anchor="start" font-weight="400">x</text><path d="M585,309 L585,146" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><path d="M563,202 L900,202" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><text x="591" y="160" font-size="18" fill="#526078" text-anchor="start" font-weight="400">時刻</text><text x="890" y="227" font-size="19" fill="#526078" text-anchor="start" font-weight="400">x</text><path d="M105,202 L315,202" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 6"/><circle cx="105" cy="202" r="6" fill="#2563eb" stroke="none" stroke-width="3"/><circle cx="245" cy="202" r="6" fill="#2563eb" stroke="none" stroke-width="3"/><text x="133" y="182" font-size="20" fill="#2563eb" text-anchor="start" font-weight="400">A (0, 0)</text><text x="245" y="250" font-size="20" fill="#2563eb" text-anchor="start" font-weight="400">B (0, 1)</text><circle cx="585" cy="202" r="6" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="760" cy="307" r="6" fill="#0f766e" stroke="none" stroke-width="3"/><text x="613" y="181" font-size="20" fill="#0f766e" text-anchor="start" font-weight="400">A (0, 0)</text><text x="736" y="341" font-size="20" fill="#0f766e" text-anchor="start" font-weight="400">B (−0.75, 1.25)</text><text x="56" y="336" font-size="20" fill="#172033" text-anchor="start" font-weight="400">AとBは同時に発光。</text><text x="520" y="255" font-size="20" fill="#172033" text-anchor="start" font-weight="400">Bの発光が先。</text><text x="32" y="400" font-size="18" fill="#526078" text-anchor="start" font-weight="400">座標は（年、光年）。光の受信時刻ではなく、発光自体の時刻。</text></g></svg>
