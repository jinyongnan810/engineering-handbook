<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">時空間隔と、信号が届く範囲</title><desc id="description">Aから見た光円錐で時間的・光的・空間的な出来事を区別。横方向以外の位置の差はゼロ。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">時空間隔と、信号が届く範囲</text><path d="M250,300 L50,100 L450,100 Z" fill="#dbeafe" stroke="none" stroke-width="0"/><path d="M250,300 L50,100 M250,300 L450,100" fill="none" stroke="#b45309" stroke-width="3"/><path d="M250,350 L250,74" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><path d="M35,300 L470,300" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="90" font-size="20" fill="#526078" text-anchor="start" font-weight="400">cΔt</text><text x="465" y="330" font-size="20" fill="#526078" text-anchor="start" font-weight="400">Δx</text><text x="225" y="330" font-size="22" fill="#172033" text-anchor="start" font-weight="400">A</text><circle cx="275" cy="160" r="7" fill="#2563eb" stroke="none" stroke-width="3"/><circle cx="390" cy="160" r="7" fill="#b45309" stroke="none" stroke-width="3"/><circle cx="425" cy="268" r="7" fill="#b91c1c" stroke="none" stroke-width="3"/><text x="292" y="158" font-size="21" fill="#2563eb" text-anchor="start" font-weight="400">T</text><text x="405" y="156" font-size="21" fill="#b45309" text-anchor="start" font-weight="400">L</text><text x="439" y="265" font-size="21" fill="#b91c1c" text-anchor="start" font-weight="400">X</text><text x="520" y="119" font-size="27" fill="#172033" text-anchor="start" font-weight="400">Δs² = c²Δt² − Δx²</text><text x="520" y="171" font-size="21" fill="#2563eb" text-anchor="start" font-weight="400">T：正・光速未満の経路で結べる</text><text x="520" y="220" font-size="21" fill="#b45309" text-anchor="start" font-weight="400">L：ゼロ・光で結べる</text><text x="520" y="269" font-size="21" fill="#b91c1c" text-anchor="start" font-weight="400">X：負・光速以下の信号では結べない</text><text x="520" y="324" font-size="19" fill="#526078" text-anchor="start" font-weight="400">時間の項を正とする符号の約束。</text><text x="32" y="393" font-size="20" fill="#526078" text-anchor="start" font-weight="400">時間差と位置の差は基準系で変わるが、時空間隔は変わらない。</text></g></svg>
