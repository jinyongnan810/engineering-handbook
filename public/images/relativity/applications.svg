<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title description"><title id="title">From spacetime effects to useful measurements</title><desc id="description">Four applications connect relativistic effects to GPS, geodesy, lensing and gravitational-wave astronomy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="470" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">From spacetime effects to useful measurements</text><rect x="32" y="83" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="54" y="117" font-size="23" fill="#2563eb" text-anchor="start" font-weight="400">GPS navigation</text><text x="54" y="159" font-size="20" fill="#172033" text-anchor="start" font-weight="400">Clock correction → accurate timing</text><text x="54" y="197" font-size="17" fill="#526078" text-anchor="start" font-weight="400">GR +45 μs/day · SR −7 → net +38</text><rect x="496" y="83" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="518" y="117" font-size="23" fill="#2563eb" text-anchor="start" font-weight="400">Precision clocks / geodesy</text><text x="518" y="159" font-size="20" fill="#172033" text-anchor="start" font-weight="400">Clock-rate difference → potential</text><text x="518" y="197" font-size="17" fill="#526078" text-anchor="start" font-weight="400">Optical-clock surveying is research.</text><rect x="32" y="253" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="54" y="287" font-size="23" fill="#0f766e" text-anchor="start" font-weight="400">Gravitational lenses</text><text x="54" y="329" font-size="20" fill="#172033" text-anchor="start" font-weight="400">Distorted light → mass distribution</text><text x="54" y="367" font-size="17" fill="#526078" text-anchor="start" font-weight="400">Also magnifies distant galaxies.</text><rect x="496" y="253" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="518" y="287" font-size="23" fill="#0f766e" text-anchor="start" font-weight="400">Gravitational waves</text><text x="518" y="329" font-size="20" fill="#172033" text-anchor="start" font-weight="400">Waveform → merging-object masses</text><text x="518" y="367" font-size="17" fill="#526078" text-anchor="start" font-weight="400">Detects systems even without light.</text><text x="32" y="444" font-size="18" fill="#526078" text-anchor="start" font-weight="400">Timing technology on Earth; new ways to measure Earth and observe the universe.</text></g></svg>
