<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title description"><title id="title">時空の効果を、測定の道具にする</title><desc id="description">相対論の効果がGPS・測地・重力レンズ・重力波観測にどうつながるかを整理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="470" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">時空の効果を、測定の道具にする</text><rect x="32" y="83" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="54" y="117" font-size="23" fill="#2563eb" text-anchor="start" font-weight="400">GPSの測位</text><text x="54" y="159" font-size="20" fill="#172033" text-anchor="start" font-weight="400">時計の補正 → 正しい時刻比較</text><text x="54" y="197" font-size="17" fill="#526078" text-anchor="start" font-weight="400">一般 +45 μs/日・特殊 −7 → 差 +38</text><rect x="496" y="83" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="518" y="117" font-size="23" fill="#2563eb" text-anchor="start" font-weight="400">精密時計・測地</text><text x="518" y="159" font-size="20" fill="#172033" text-anchor="start" font-weight="400">時計の進み方の差 → ポテンシャル差</text><text x="518" y="197" font-size="17" fill="#526078" text-anchor="start" font-weight="400">光時計を使う測地への応用は研究段階。</text><rect x="32" y="253" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="54" y="287" font-size="23" fill="#0f766e" text-anchor="start" font-weight="400">重力レンズ</text><text x="54" y="329" font-size="20" fill="#172033" text-anchor="start" font-weight="400">光のゆがみ → 質量分布</text><text x="54" y="367" font-size="17" fill="#526078" text-anchor="start" font-weight="400">遠くの銀河を拡大する効果もある。</text><rect x="496" y="253" width="432" height="146" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="518" y="287" font-size="23" fill="#0f766e" text-anchor="start" font-weight="400">重力波</text><text x="518" y="329" font-size="20" fill="#172033" text-anchor="start" font-weight="400">波形 → 合体する天体の質量</text><text x="518" y="367" font-size="17" fill="#526078" text-anchor="start" font-weight="400">光を出さない系も観測できる。</text><text x="32" y="444" font-size="18" fill="#526078" text-anchor="start" font-weight="400">地上の時刻技術から、地球の測定や宇宙を観測する手段まで。</text></g></svg>
