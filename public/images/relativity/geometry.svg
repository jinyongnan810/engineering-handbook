<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">Geometry determines free-fall paths</title><desc id="description">A sphere gives a limited spatial analogy for a geodesic; an orbiting satellite falls freely around Earth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">Geometry determines free-fall paths</text><rect x="32" y="85" width="432" height="275" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><rect x="496" y="85" width="432" height="275" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><circle cx="248" cy="223" r="97" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><ellipse cx="248" cy="223" rx="97" ry="32" fill="none" stroke="#d6dfeb" stroke-width="2"/><ellipse cx="248" cy="223" rx="35" ry="97" fill="none" stroke="#d6dfeb" stroke-width="2"/><path d="M151,223 A97,50 0 0 1 345,223" fill="none" stroke="#0f766e" stroke-width="5"/><circle cx="151" cy="223" r="6" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="345" cy="223" r="6" fill="#0f766e" stroke="none" stroke-width="3"/><text x="56" y="120" font-size="20" fill="#172033" text-anchor="start" font-weight="400">Geodesic: straightest available path</text><text x="56" y="339" font-size="18" fill="#526078" text-anchor="start" font-weight="400">Sphere surface: spatial analogy only</text><circle cx="710" cy="224" r="41" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="710" y="232" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="400">Earth</text><ellipse cx="710" cy="224" rx="155" ry="74" fill="none" stroke="#d6dfeb" stroke-width="3"/><circle cx="710" cy="150" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><path d="M710,150 L795,150" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><path d="M710,163 L710,180" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="520" y="120" font-size="22" fill="#172033" text-anchor="start" font-weight="400">Orbit: continuous free fall</text><text x="810" y="157" font-size="18" fill="#0f766e" text-anchor="start" font-weight="400">velocity</text><text x="520" y="339" font-size="19" fill="#526078" text-anchor="start" font-weight="400">Gravity changes the direction of motion.</text><text x="32" y="400" font-size="20" fill="#526078" text-anchor="start" font-weight="400">A curved spatial orbit can be a free-fall geodesic through spacetime.</text></g></svg>
