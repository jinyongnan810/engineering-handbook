<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">動く時計と定規</title><desc id="description">0.6cでは船内4年が地球側5年に対応し、固有長100 mは地球の系で80 m。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">動く時計と定規</text><text x="32" y="78" font-size="21" fill="#526078" text-anchor="start" font-weight="400">相対速度0.6c → γ = 1.25</text><rect x="32" y="101" width="432" height="245" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><rect x="496" y="101" width="432" height="245" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="56" y="138" font-size="22" fill="#172033" text-anchor="start" font-weight="400">同じ二つの出来事の間の時間</text><circle cx="115" cy="205" r="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M115,205 L115,186" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M115,205 L129,213" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="325" cy="205" r="30" fill="white" stroke="#0f766e" stroke-width="3"/><path d="M325,205 L325,186" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M325,205 L339,213" fill="none" stroke="#0f766e" stroke-width="3"/><text x="115" y="270" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="400">地球側：5年</text><text x="325" y="270" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="400">船内：4年</text><text x="248" y="321" font-size="24" fill="#526078" text-anchor="middle" font-weight="400">Δt = γΔτ</text><text x="520" y="138" font-size="22" fill="#172033" text-anchor="start" font-weight="400">運動方向の長さ</text><rect x="525" y="177" width="350" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/><rect x="525" y="260" width="280" height="24" rx="4" fill="#ccfbf1" stroke="#0f766e"/><text x="525" y="232" font-size="22" fill="#2563eb" text-anchor="start" font-weight="400">静止系：100 m</text><text x="525" y="321" font-size="22" fill="#0f766e" text-anchor="start" font-weight="400">地球の系：80 m</text><text x="32" y="389" font-size="18" fill="#526078" text-anchor="start" font-weight="400">長さは地球の系で両端を同時に測定。手元の時計は普通に進む。</text></g></svg>
