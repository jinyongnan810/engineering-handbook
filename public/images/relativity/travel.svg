<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">One journey, two elapsed times</title><desc id="description">A worked journey showing acceleration, cruise and braking times on the ship and planets.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">One journey, two elapsed times</text><text x="32" y="78" font-size="20" fill="#526078" text-anchor="start" font-weight="400">80% c · 1 planet-year per ramp · 4.24 light-years</text><rect x="32" y="103" width="276" height="185" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="52" y="137" font-size="23" fill="#172033" text-anchor="start" font-weight="600">Accelerate</text><text x="52" y="177" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">0 → 0.8c</text><text x="52" y="220" font-size="21" fill="#0f766e" text-anchor="start" font-weight="400">Ship  0.824 yr</text><text x="52" y="255" font-size="21" fill="#172033" text-anchor="start" font-weight="400">Planet  1 yr</text><path d="M314,185 L334,185" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><rect x="342" y="103" width="276" height="185" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="362" y="137" font-size="23" fill="#172033" text-anchor="start" font-weight="600">Cruise</text><text x="362" y="177" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">0.8c</text><text x="362" y="220" font-size="21" fill="#0f766e" text-anchor="start" font-weight="400">Ship  2.430 yr</text><text x="362" y="255" font-size="21" fill="#172033" text-anchor="start" font-weight="400">Planet  4.05 yr</text><path d="M624,185 L644,185" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><rect x="652" y="103" width="276" height="185" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="672" y="137" font-size="23" fill="#172033" text-anchor="start" font-weight="600">Brake</text><text x="672" y="177" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">0.8c → 0</text><text x="672" y="220" font-size="21" fill="#0f766e" text-anchor="start" font-weight="400">Ship  0.824 yr</text><text x="672" y="255" font-size="21" fill="#172033" text-anchor="start" font-weight="400">Planet  1 yr</text><text x="32" y="337" font-size="26" fill="#0f766e" text-anchor="start" font-weight="400">Ship: 4.078 years</text><text x="480" y="337" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">Destination: 6.05 years</text><text x="32" y="383" font-size="18" fill="#526078" text-anchor="start" font-weight="400">Constant proper acceleration; phase boxes are not to scale.</text></g></svg>
