<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="title description"><title id="title">Energy grows; invariant mass stays fixed</title><desc id="description">Stacked energy bars at three speeds distinguish rest and kinetic energy; a separate photon panel shows zero rest mass with nonzero momentum.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="448" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">Energy grows; invariant mass stays fixed</text><text x="32" y="80" font-size="20" fill="#526078" text-anchor="start" font-weight="400">Massive particle · same invariant mass m</text><rect x="65" y="206" width="100" height="100" rx="0" fill="#dbeafe" stroke="#2563eb"/><text x="115" y="188" font-size="20" fill="#172033" text-anchor="middle" font-weight="400">1 mc²</text><text x="115" y="340" font-size="21" fill="#526078" text-anchor="middle" font-weight="400">0c</text><text x="115" y="375" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="400">K = 0 mc²</text><rect x="235" y="206" width="100" height="100" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="235" y="181" width="100" height="25" rx="0" fill="#ccfbf1" stroke="#0f766e"/><text x="285" y="163" font-size="20" fill="#172033" text-anchor="middle" font-weight="400">1.25 mc²</text><text x="285" y="340" font-size="21" fill="#526078" text-anchor="middle" font-weight="400">0.6c</text><text x="285" y="375" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="400">K = 0.25 mc²</text><rect x="405" y="206" width="100" height="100" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="405" y="139.33333333333331" width="100" height="66.66666666666667" rx="0" fill="#ccfbf1" stroke="#0f766e"/><text x="455" y="121.33333333333331" font-size="20" fill="#172033" text-anchor="middle" font-weight="400">1.667 mc²</text><text x="455" y="340" font-size="21" fill="#526078" text-anchor="middle" font-weight="400">0.8c</text><text x="455" y="375" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="400">K = 0.667 mc²</text><rect x="610" y="101" width="318" height="235" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="635" y="139" font-size="24" fill="#b45309" text-anchor="start" font-weight="400">Photon</text><text x="635" y="187" font-size="27" fill="#172033" text-anchor="start" font-weight="400">m = 0</text><text x="635" y="235" font-size="30" fill="#b45309" text-anchor="start" font-weight="400">E = pc</text><text x="635" y="280" font-size="26" fill="#b45309" text-anchor="start" font-weight="400">p = E/c ≠ 0</text><text x="635" y="315" font-size="19" fill="#526078" text-anchor="start" font-weight="400">No photon rest frame.</text><text x="32" y="421" font-size="18" fill="#526078" text-anchor="start" font-weight="400">Blue: rest energy mc². Teal: kinetic energy K. For m &gt; 0, v → c needs K → ∞.</text></g></svg>
