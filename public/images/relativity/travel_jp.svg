<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">同じ旅でも、経過時間は二つ</title><desc id="description">加速・巡航・減速の各区間について、船内と惑星側の経過時間を比較。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">同じ旅でも、経過時間は二つ</text><text x="32" y="78" font-size="20" fill="#526078" text-anchor="start" font-weight="400">光速の80%・加速と減速は各1年（惑星側）・4.24光年</text><rect x="32" y="103" width="276" height="185" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="52" y="137" font-size="23" fill="#172033" text-anchor="start" font-weight="600">加速</text><text x="52" y="177" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">0 → 0.8c</text><text x="52" y="220" font-size="21" fill="#0f766e" text-anchor="start" font-weight="400">船内  0.824 年</text><text x="52" y="255" font-size="21" fill="#172033" text-anchor="start" font-weight="400">惑星側  1 年</text><path d="M314,185 L334,185" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><rect x="342" y="103" width="276" height="185" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="362" y="137" font-size="23" fill="#172033" text-anchor="start" font-weight="600">巡航</text><text x="362" y="177" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">0.8c</text><text x="362" y="220" font-size="21" fill="#0f766e" text-anchor="start" font-weight="400">船内  2.430 年</text><text x="362" y="255" font-size="21" fill="#172033" text-anchor="start" font-weight="400">惑星側  4.05 年</text><path d="M624,185 L644,185" fill="none" stroke="#526078" stroke-width="2" marker-end="url(#arrow)"/><rect x="652" y="103" width="276" height="185" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="672" y="137" font-size="23" fill="#172033" text-anchor="start" font-weight="600">減速</text><text x="672" y="177" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">0.8c → 0</text><text x="672" y="220" font-size="21" fill="#0f766e" text-anchor="start" font-weight="400">船内  0.824 年</text><text x="672" y="255" font-size="21" fill="#172033" text-anchor="start" font-weight="400">惑星側  1 年</text><text x="32" y="337" font-size="26" fill="#0f766e" text-anchor="start" font-weight="400">船内の合計：4.078年</text><text x="480" y="337" font-size="26" fill="#2563eb" text-anchor="start" font-weight="400">目的地の合計：6.05年</text><text x="32" y="383" font-size="18" fill="#526078" text-anchor="start" font-weight="400">固有加速度は一定。各区間の箱の幅は時間や距離の比ではない。</text></g></svg>
