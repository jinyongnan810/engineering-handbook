<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description"><title id="title">重力は時計と光の経路にも影響する</title><desc id="description">地表付近では高い位置の静止時計ほど速い。右は質量の周囲を曲がる光の経路の概念図。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="960" height="420" rx="18" fill="#ffffff"/><g font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"><text x="32" y="43" font-size="27" fill="#172033" text-anchor="start" font-weight="650">重力は時計と光の経路にも影響する</text><rect x="32" y="85" width="432" height="275" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><rect x="496" y="85" width="432" height="275" rx="16" fill="#f3f6fb" stroke="#d6dfeb"/><text x="56" y="122" font-size="21" fill="#172033" text-anchor="start" font-weight="400">地表付近に静止させた時計</text><circle cx="103" cy="182" r="30" fill="white" stroke="#0f766e" stroke-width="3"/><path d="M103,182 L103,163" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M103,182 L117,190" fill="none" stroke="#0f766e" stroke-width="3"/><circle cx="103" cy="282" r="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M103,282 L103,263" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M103,282 L117,290" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M60,329 L430,329" fill="none" stroke="#526078" stroke-width="3"/><text x="155" y="177" font-size="22" fill="#0f766e" text-anchor="start" font-weight="400">高い位置：速く進む</text><text x="155" y="211" font-size="18" fill="#526078" text-anchor="start" font-weight="400">重力ポテンシャルが高い</text><text x="155" y="282" font-size="22" fill="#2563eb" text-anchor="start" font-weight="400">低い位置：遅く進む</text><text x="520" y="122" font-size="21" fill="#172033" text-anchor="start" font-weight="400">光も曲がった時空に沿って進む</text><path d="M535,225 C610,225 650,137 714,170 C780,200 805,225 883,225" fill="none" stroke="#b45309" stroke-width="3"/><path d="M535,225 C610,225 650,313 714,280 C780,250 805,225 883,225" fill="none" stroke="#b45309" stroke-width="3"/><circle cx="535" cy="225" r="7" fill="#b45309" stroke="none" stroke-width="3"/><circle cx="706" cy="225" r="29" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="883" cy="225" r="7" fill="#0f766e" stroke="none" stroke-width="3"/><text x="535" y="329" font-size="19" fill="#b45309" text-anchor="middle" font-weight="400">光源</text><text x="706" y="329" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="400">質量</text><text x="874" y="329" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="400">観測者</text><text x="32" y="400" font-size="18" fill="#526078" text-anchor="start" font-weight="400">時計の進み方は比較したときの差。局所的な真空中の光速はcのまま。</text></g></svg>
